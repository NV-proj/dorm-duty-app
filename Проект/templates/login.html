<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <div class="box">
        <h2 style="text-align: left;">Вход</h2>

        <!-- Вывод ошибок -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="name" placeholder="Имя (логин)" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <p style="text-align: left; font-size: 14px;">
            Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a>
        </p>
    </div>
</body>
</html>
